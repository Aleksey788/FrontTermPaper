 <linearGradient id="light" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#ffc36a" stop-opacity=".94"/><stop offset="1" stop-color="#fff8ec" stop-opacity="0"/></linearGradient>
 <linearGradient id="pale" x1=".6" y1="0" x2="0" y2="1"><stop stop-color="#fff0d4"/><stop offset="1" stop-color="#fff9f1"/></linearGradient>
</defs>
